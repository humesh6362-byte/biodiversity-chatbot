name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 app --max-line-length=100

      - name: Check formatting (black + isort)
        run: |
          black --check app
          isort --check-only app

      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_TEST_PLACEHOLDER || 'test-key' }}
        run: pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        run: |
          echo "Wire this to your platform's deploy hook (Render/Railway/Fly.io),"
          echo "or use that platform's native auto-deploy-on-push GitHub integration."
