<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Darukaa.Earth — AI Biodiversity Intelligence</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; background: #f6f8f7; color: #0f2a1f; }
  h2 { margin-bottom: 4px; }
  .sub { color: #666; margin-bottom: 20px; font-size: 0.9rem; }
  #log { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  .msg { padding: 12px 16px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; }
  .user { background: #1f7a4d; color: white; align-self: flex-end; }
  .bot { background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.08); align-self: flex-start; }
  .rec { border-top: 1px solid #eee; margin-top: 8px; padding-top: 8px; font-size: 0.9rem; }
  .rec b { color: #1f7a4d; }
  .sources { font-size: 0.78rem; color: #888; margin-top: 10px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #d0d5d3; }
  button { padding: 12px 18px; border: none; border-radius: 8px; background: #1f7a4d; color: white; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <h2>🌱 Darukaa.Earth — AI Biodiversity Intelligence</h2>
  <p class="sub">Describe a land / ecosystem problem. The assistant will ask for missing
  environmental variables, then give evidence-backed, multi-metric recommendations.</p>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="e.g. Biodiversity is declining on my land..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>

<script>
const API_URL = "http://localhost:8000/api/chat";
const sessionId = "session-" + Math.random().toString(36).slice(2);
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  log.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
  return div;
}

function renderBotResponse(data) {
  const div = document.createElement("div");
  div.className = "msg bot";

  const summary = document.createElement("div");
  summary.textContent = data.message;
  div.appendChild(summary);

  if (data.recommendations && data.recommendations.length > 0) {
    data.recommendations.forEach((r, i) => {
      const recDiv = document.createElement("div");
      recDiv.className = "rec";
      recDiv.innerHTML = `<b>${i + 1}. ${r.action}</b><br/>
        ${r.reasoning}<br/>
        <i>Impacted metrics:</i> ${r.impacted_metrics.join(", ")}<br/>
        <i>Estimated improvement:</i> ${r.estimated_improvement || "n/a"}<br/>
        <i>Time horizon:</i> ${r.time_horizon} &nbsp; <i>Confidence:</i> ${r.confidence || "n/a"}<br/>
        <i>Reference:</i> ${r.reference}`;
      div.appendChild(recDiv);
    });
  }

  if (data.sources && data.sources.length > 0) {
    const srcDiv = document.createElement("div");
    srcDiv.className = "sources";
    srcDiv.textContent = "Retrieved from knowledge base: " + data.sources.map(s => s.source).join(" | ");
    div.appendChild(srcDiv);
  }

  log.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  addMessage(message, "user");
  input.value = "";

  const thinking = addMessage("Thinking...", "bot");

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message }),
    });
    const data = await res.json();
    thinking.remove();
    renderBotResponse(data);
  } catch (err) {
    thinking.textContent = "Error contacting the API. Is the backend running on :8000?";
  }
});
</script>
</body>
</html>
